name: Newport Communications
description: NewPort Communications was a fabless semiconductor startup that developed mixed-signal integrated circuits
  for the high-speed optical networking market, including CMOS-based transceivers for 2.5-Gbit/s (OC-48) SONET/SDH
  applications. Founded in 1999, the company was backed by Mayfield Fund, Bessemer Venture Partners, and Cisco Investments
  (roughly $28M across Series A and B) before being acquired by Broadcom on October 4, 2000 to strengthen Broadcom's
  networking semiconductor portfolio. It is a defunct company with no standalone public web presence and no API
  surface; this record is retained as a historical portfolio-company lead in the API Evangelist network.
